aid: simplenexus
name: SimpleNexus
description: >-
  SimpleNexus was a mobile-first digital homeownership and mortgage platform,
  backed by Insight Partners, that connected loan officers, borrowers, real
  estate agents, and settlement teams across the loan lifecycle. It was acquired
  by nCino and its product is now delivered as the nCino Mortgage Suite. The
  developer API has been rehosted at developer.ncinomortgage.com as the nCino
  Mortgage API, which is explicitly built to replace the legacy SimpleNexus API
  (v0-SNAPI). The current API is an OAuth 2.0 REST API (base URL
  https://api.ncinomortgage.com) whose initial release covers Organization and
  User Management — company administration, branch management, user
  provisioning — plus a modern webhook flow with delivery retries, event
  filtering, and increased security.
